name: Deploy AI Gateway

on:
  push:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AI_GATEWAY_APP_DIR: /var/www/trpg-ai-gateway

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack release
        run: |
          tar -czf trpg-ai-gateway.tar.gz \
            package.json \
            pnpm-lock.yaml \
            README.md \
            dist \
            data \
            skills

      - name: Prepare remote release directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -eu
            APP_DIR="${{ env.AI_GATEWAY_APP_DIR }}"
            RELEASE_DIR="${APP_DIR}/releases/${{ github.sha }}"
            sudo mkdir -p "$RELEASE_DIR"
            sudo chown -R "${USER}:${USER}" "$APP_DIR"

      - name: Upload release package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "trpg-ai-gateway.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: Install and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -eu
            APP_DIR="${{ env.AI_GATEWAY_APP_DIR }}"
            ENV_FILE="${{ secrets.AI_GATEWAY_ENV_FILE }}"
            SERVICE_NAME="${{ secrets.AI_GATEWAY_SERVICE_NAME }}"
            if [ -z "$ENV_FILE" ]; then
              echo "Missing required secret: AI_GATEWAY_ENV_FILE" >&2
              exit 1
            fi
            if [ -z "$SERVICE_NAME" ]; then
              echo "Missing required secret: AI_GATEWAY_SERVICE_NAME" >&2
              exit 1
            fi
            RELEASE_DIR="${APP_DIR}/releases/${{ github.sha }}"

            tar -xzf /tmp/trpg-ai-gateway.tar.gz -C "$RELEASE_DIR"

            sudo ln -sfn "$RELEASE_DIR" "${APP_DIR}/current"

            if ! sudo test -f "$ENV_FILE"; then
              echo "Runtime environment file is missing on the server." >&2
              exit 1
            fi

            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            NODE_MAJOR="$(node -p 'Number(process.versions.node.split(".")[0])')"
            if [ "$NODE_MAJOR" -lt 20 ]; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            NODE_BIN="$(command -v node)"

            sudo tee "/etc/systemd/system/${SERVICE_NAME}.service" > /dev/null <<SYSTEMD
            [Unit]
            Description=TRPG AI Gateway
            After=network.target

            [Service]
            WorkingDirectory=${APP_DIR}/current
            EnvironmentFile=${ENV_FILE}
            ExecStart=${NODE_BIN} dist/server.js
            Restart=always
            RestartSec=3
            User=${{ secrets.SERVER_USER }}
            Group=${{ secrets.SERVER_USER }}

            [Install]
            WantedBy=multi-user.target
            SYSTEMD

            sudo systemctl daemon-reload
            sudo systemctl enable "$SERVICE_NAME"
            sudo systemctl restart "$SERVICE_NAME"
            sudo systemctl status "$SERVICE_NAME" --no-pager
